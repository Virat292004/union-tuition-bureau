services:
  - type: web
    name: union-tuition-bureau
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: union-tuition-bureau-db
          property: connectionString

databases:
  - name: union-tuition-bureau-db
    region: singapore
    plan: free
